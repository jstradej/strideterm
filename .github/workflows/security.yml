name: Security Scan

on:
  push:
    branches: [main, master, mobile]
  pull_request:
    branches: [main, master, mobile]
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the working tree: a secret committed and later removed
          # is still fully recoverable from `git log`, and a repository that has ever held one has to
          # find out from a scan rather than from an incident.
          fetch-depth: 0
      - name: Scan
        # A pinned release binary rather than a third-party action, matching the sibling repository's
        # own gate: this repo pins every action to a commit SHA, and there is no reason to take on
        # another one when the tool is a single static binary. The download is verified against the
        # release's own checksum file before it runs.
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o gitleaks-checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          CANARY_DIR="$(mktemp -d)"
          printf '%s\n' 'api_key = "V8mK3pR7sW2nX9qT4yZ6aB1cD5eF8gH0jL2uN7rP"' > "${CANARY_DIR}/canary.txt"
          set +e
          ./gitleaks detect --no-git --source "${CANARY_DIR}" --config .gitleaks.toml --redact --no-banner --exit-code 42 >/dev/null 2>&1
          CANARY_EXIT=$?
          set -e
          if [ "${CANARY_EXIT}" -ne 42 ]; then
            echo "::error::Gitleaks did not detect the synthetic canary (exit ${CANARY_EXIT})"
            exit 1
          fi
          printf 'firebase_api_key = "AIza%s"\n' 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > "${CANARY_DIR}/canary.txt"
          set +e
          ./gitleaks detect --no-git --source "${CANARY_DIR}" --config .gitleaks.toml --redact --no-banner --exit-code 42 >/dev/null 2>&1
          FIREBASE_CANARY_EXIT=$?
          set -e
          rm -rf "${CANARY_DIR}"
          if [ "${FIREBASE_CANARY_EXIT}" -ne 42 ]; then
            echo "::error::Gitleaks did not detect the synthetic Firebase key (exit ${FIREBASE_CANARY_EXIT})"
            exit 1
          fi
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  licence-gate:
    name: Licence gate (shipped dependencies only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every production dependency carries a permissive licence
        # Allowlist, not denylist: an unrecognised licence fails and has to be read and decided on.
        # The production hardening plan asks for this gate in BOTH repositories — a permissive tree
        # here and an unread obligation in the sibling repo is not a supply chain anybody has checked.
        run: npm run check:licences

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Block the workflow on high-severity CVEs (same threshold as CI).
      - name: Audit — high severity (blocking)
        run: npm audit --audit-level=high

      # Surface moderate-severity findings as informational. These are often
      # transitive dependencies where no fix is available yet; tracking them
      # here keeps them visible without breaking CI on every PR.
      - name: Audit — moderate severity (informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # Verify registry signatures. A missing or invalid signature can indicate
      # a supply-chain tampering attempt. Marked continue-on-error because the
      # npm signature database is occasionally incomplete for older packages.
      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true

  static-analysis:
    name: Static security analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # eslint-plugin-security (included in npm run lint) catches OWASP Top 10
      # issues: eval injection, unsafe regex (ReDoS), prototype pollution, etc.
      - name: Lint with security rules
        run: npm run lint

  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm sbom (built-in since npm 8.19) generates a CycloneDX SBOM listing
      # every direct and transitive dependency with resolved versions.
      # The artifact can be used for licence audits and CVE cross-referencing
      # against external databases (NIST NVD, OSV, etc.).
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30
