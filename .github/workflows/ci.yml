name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Read-only — CI never writes to the repo. Without this default, branch
# pushes inherit the repo-level token scope which can be `contents: write`.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      # Pin to commit SHA, not the floating tag — same reasoning as
      # release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Check package publish age
        run: npx tsx scripts/check-package-age.mts --allow=follow-redirects@1.16.0,tmp@0.2.6
      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true
      - name: Lint (includes security static analysis)
        run: npm run lint
        # eslint's type-aware + security static analysis exceeds Node's default
        # ~2GB old-space heap on the macOS runner (OOM, exit 134); the codebase
        # grew past that ceiling. Give it headroom on every OS.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm test
      - run: npm run build
