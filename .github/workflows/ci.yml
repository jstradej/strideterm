name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Read-only — CI never writes to the repo. Without this default, branch
# pushes inherit the repo-level token scope which can be `contents: write`.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      # Pin to commit SHA, not the floating tag — same reasoning as
      # release.yml.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Check package publish age
        run: npx tsx scripts/check-package-age.mts --allow=follow-redirects@1.16.0,tmp@0.2.6
      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true
      - name: Lint (includes security static analysis)
        run: npm run lint
      - run: npm test
      - run: npm run build
