name: Release

on:
  push:
    tags:
      - "v*"

# Default to read-only at the workflow level. The publish job below
# elevates to `contents: write` for the actual GitHub Release upload.
# Build jobs only need to read source + write artifacts (the artifact
# action stores them out-of-band, no repo write needed).
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          # Pinned to a fixed image (not macos-latest) so the build
          # environment doesn't shift under us when GitHub migrates the
          # `latest` label to a newer macOS/SDK. macos-14 = Apple Silicon,
          # stable, broad runtime compatibility for the produced app.
          - os: macos-14
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party / first-party actions pinned to a full commit SHA. Tags
      # like @v6 are mutable — a compromised maintainer (or compromised
      # GitHub account) can move v6 to a malicious commit and we'd silently
      # pull it on the next CI run, with `contents: write` and our code-
      # signing secrets in scope. Renovate / Dependabot handle SHA updates
      # the same way as tag updates, so the maintenance cost is identical.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

      # Drop cpu-features before electron-builder kicks @electron/rebuild.
      # cpu-features is an *optional* dep of ssh2 used only as an AES-NI hint
      # for Linux native crypto; ssh2 falls back to Node's crypto module when
      # the package is missing. The native source ships against NAN, which
      # has not been updated for V8 13.x's mandatory `ExternalPointerTypeTag`
      # arg on `External::New` / `External::Value` — so rebuilding it for
      # Electron 42's V8 fails on every platform with
      # "candidate expects 3 arguments, 2 provided". Removing the package
      # makes @electron/rebuild skip it entirely. Cross-platform via node fs.
      - name: Drop cpu-features (NaN/V8 incompat with Electron 42)
        run: node -e "require('node:fs').rmSync('node_modules/cpu-features',{recursive:true,force:true})"

      - name: Build Windows distributables
        if: matrix.os == 'windows-latest'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # GH_TOKEN deliberately *not* exposed to electron-builder here:
          # `--publish never` doesn't talk to GitHub, so handing it the
          # token would only widen the blast radius if the build step
          # were compromised. Code-signing secrets are required.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build distributables
        if: matrix.os != 'windows-latest'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.yaml
          if-no-files-found: warn

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CycloneDX SBOM bound to the release tag — anyone consuming the
      # release artifact can map every shipped binary blob back to the exact
      # transitive dependency graph it was built from. Without this the
      # SBOM only existed as a weekly security-scan artifact, retained 30
      # days, and not connected to any specific binary.
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > strideterm-sbom-${{ github.ref_name }}.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: strideterm-sbom-*.json
          if-no-files-found: error

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    # Only this job needs write access — it creates the GitHub Release.
    # Scoping the permission here (rather than at workflow level) means a
    # compromised build step on Windows / macOS / Linux can't push tags
    # or modify repository content while running with our secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          # SBOM ships alongside the binaries so downstream users can map
          # every release back to its dependency graph without rebuilding.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
