# Audited deterministic test fixtures only. Default gitleaks rules remain enabled.

[extend]
useDefault = true

# Firebase client keys are public identifiers, but this repository deliberately
# distributes production configuration through a signed bootstrap instead of Git.
[[rules]]
id = "firebase-client-api-key-in-git"
description = "Firebase API key must be delivered outside Git, even though it is public client configuration"
regex = '''AIza[0-9A-Za-z_-]{30,}'''

[[rules.allowlists]]
description = "Published synthetic bootstrap vector, never a real Firebase project key"
condition = "AND"
regexTarget = "secret"
paths = ['^electron/backend/mobile/mobile-bootstrap-vectors\.json$']
regexes = ['^AIzaSyD-Example-Public-Identifier-0001$']

[[allowlists]]
description = "Synthetic secret-scan canary in the security and release workflows"
condition = "AND"
regexTarget = "secret"
paths = ['^\.github/workflows/(?:security|release)\.yml$']
regexes = ['^V8mK3pR7sW2nX9qT4yZ6aB1cD5eF8gH0jL2uN7rP$']

[[allowlists]]
description = "audited deterministic fixtures: electron/backend/logger-redaction\\\\.test\\\\.ts"
condition = "AND"
regexTarget = "secret"
paths = ['^electron/backend/logger-redaction\.test\.ts$']
regexes = ['^(?:eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9\.eyJhdWQiOiJkZW1vIn0\.AbCdEfGhIjKlMnOp)$']

